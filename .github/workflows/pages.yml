name: Publish reading homepage
on:
  push:
    branches: [main]
    paths:
      - 'chapters/**'
      - 'appendices/**'
      - 'assets/images/**'
      - 'examples/creative-lab/**/renders/export/**'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/check_structure.py'
      - 'scripts/book_manifest.py'
      - 'book.json'
      - 'website/**'
      - 'requirements-site.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-site.txt
      - run: python -m pip install -r requirements-site.txt
      - name: Build reading site
        run: |
          python scripts/check_structure.py
          python scripts/build_site.py
      - name: Validate local links
        run: python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy reading site
        id: deployment
        uses: actions/deploy-pages@v4
