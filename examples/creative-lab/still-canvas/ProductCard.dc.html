<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>商品卡 / 原生导入模板</title><script src="./support.js"></script></head><body><x-dc><helmet><style>@font-face{font-family:"STILL Sans";src:url("uploads/NotoSansSC-Regular.ttf")}body{margin:0;font-family:"STILL Sans","Noto Sans SC",sans-serif;color:#20211D}button,input{font:inherit}button:focus-visible{outline:3px solid #424A32;outline-offset:4px}a{color:inherit}</style></helmet><main style="width:405px;height:240px;box-sizing:border-box;padding:0px;display:flex;flex-direction:column;gap:32px;background:#F5F3EC;overflow:hidden"><article style="padding:22px 0;width:100%;height:100%;box-sizing:border-box;background:{{paper}};color:{{ink}};border-top:3px solid #20211D;display:flex;flex-direction:column;gap:12px"><div style="font:12px monospace;letter-spacing:1px">{{series}}</div><h3 style="font-size:29px;line-height:1.4;font-weight:400;margin:0;overflow-wrap:anywhere">{{productname}}</h3><span style="font-size:15px;line-height:1.6">{{flavor}}</span><div style="font-size:13px;color:#606156">250 g 咖啡豆 / 中度烘焙</div><footer style="margin-top:auto;display:flex;justify-content:space-between;align-items:center"><span style="font:25px monospace;white-space:nowrap;flex-shrink:0">{{price}}</span><span style="font-size:13px">WHOLE BEANS</span></footer></article></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 405, "height": 240}, "productname": {"default": "日常拼配"}, "series": {"default": "01 / EVERYDAY"}, "flavor": {"default": "榛果 · 可可 · 焦糖"}, "price": {"default": "¥ 68"}, "ink": {"editor": "color", "default": "#20211D"}, "paper": {"editor": "color", "default": "#F5F3EC"}}'>class Component extends DCLogic {state={monthly:true,selected:1,added:false};renderVals(){return {productname:this.props.productname,series:this.props.series,flavor:this.props.flavor,price:this.props.price,ink:this.props.ink,paper:this.props.paper};}}</script></body></html>
