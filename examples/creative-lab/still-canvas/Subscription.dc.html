<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>04 编辑型订阅电商 · GOOD DAYS ON REPEAT</title><script src="./support.js"></script></head><body><x-dc><helmet><style>@font-face{font-family:"STILL Sans";src:url("uploads/NotoSansSC-Regular.ttf")}body{margin:0;font-family:"STILL Sans","Noto Sans SC",sans-serif;color:#20211D}button,input{font:inherit}button:focus-visible{outline:3px solid #424A32;outline-offset:4px}a{color:inherit}</style></helmet><main style="width:1440px;height:1100px;box-sizing:border-box;padding:48px;display:flex;flex-direction:column;gap:32px;background:#F5F3EC;overflow:hidden"><header style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:baseline;gap:20px;color:#20211D"><span style="font:700 42px/.9 Arial,sans-serif;letter-spacing:-3px">[STILL]</span><span style="font-size:15px;letter-spacing:3px">隙间</span></div><nav style="display:flex;gap:34px;font-size:15px"><a href="#coffee" style="text-decoration:none">本期咖啡</a><a href="#subscription" style="text-decoration:none">订阅计划</a><span>品牌手记</span></nav><span style="font:13px monospace">BAG / 00</span></header><div style="height:1px;background:#20211D;width:100%;flex-shrink:0"></div><div style="display:flex;justify-content:space-between;align-items:baseline"><h1 style="font:700 91px/.95 Arial,sans-serif;letter-spacing:-5px;margin:0">GOOD DAYS.<br>ON REPEAT.</h1><div style="font-size:24px;line-height:1.65;max-width:450px">咖啡如期而至，<br>日子不必赶。<div style="font-size:15px;color:#606156;margin-top:12px">每月两袋，留一支给熟悉，一支给新鲜。</div></div></div><div style="display:flex;height:220px;flex-shrink:0;background:#424A32;overflow:hidden"><img src="uploads/still-coffee-v4.png" alt="AI俯拍咖啡情境，非商品实拍" style="width:67%;height:220px;object-fit:cover;object-position:65% 42%"><div style="width:33%;display:flex;flex-direction:column;justify-content:space-between;padding:26px 30px;box-sizing:border-box;color:#F5F3EC"><div style="font:13px monospace">THE MONTHLY EDIT / 01</div><div style="font-size:26px;line-height:1.5">本期三支，<br>由你慢慢选择。</div><div style="font-size:13px">一杯、一刻、一个间隙。</div></div></div><section id="subscription" style="padding:22px 24px;border:1px solid #20211D;display:flex;justify-content:space-between;align-items:center;gap:24px"><div><div style="font-size:20px">选择你的节奏</div><p role="status" style="font-size:14px;color:#606156;margin:8px 0 0">{{planText}}</p></div><div style="display:flex;gap:10px"><button type="button" onClick="{{pickMonthly}}" style="height:52px;padding:0 24px;border:1px solid #20211D;background:#F05A24;color:#20211D;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer">每月订阅</button><button type="button" onClick="{{pickOnce}}" style="height:52px;padding:0 24px;border:1px solid #20211D;background:#F5F3EC;color:#20211D;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer">先试一次</button></div><div><div style="font-size:21px;white-space:nowrap">{{summary}}</div><div style="font-size:13px;color:#606156;margin-top:8px">两袋各250 g / 发货前可调整</div></div><button type="button" onClick="{{addPlan}}" style="height:52px;padding:0 24px;border:1px solid #20211D;background:#F05A24;color:#20211D;font-size:16px;font-weight:600;white-space:nowrap;cursor:pointer">{{actionText}}</button></section><section id="coffee" style="display:flex;flex-direction:column;gap:16px"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px;font-weight:400;margin:0;white-space:nowrap">本期咖啡 / COFFEE INDEX</h2><span style="font-size:13px;color:#606156">虚构教学商品与价格</span></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px"><dc-import name="ProductCard" productname="日常拼配" series="01 / EVERYDAY" flavor="榛果 · 可可 · 焦糖" price="¥ 68" hint-size="405px,240px"></dc-import><dc-import name="ProductCard" productname="山坡花开" series="02 / SEASONAL" flavor="白花 · 柑橘 · 蜂蜜" price="¥ 88" hint-size="405px,240px"></dc-import><dc-import name="ProductCard" productname="夜色低因" series="03 / AFTER HOURS" flavor="熟果 · 黑糖 · 坚果" price="¥ 78" hint-size="405px,240px"></dc-import></div></section><footer style="display:flex;justify-content:space-between;border-top:1px solid #20211D;padding-top:14px;font-size:13px"><span>烘焙日期随包标注 / 下一次发货前可暂停</span><span role="status">{{feedback}}</span></footer></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1100}}'>class Component extends DCLogic {state={monthly:true,selected:1,added:false};renderVals(){const monthly=this.state.monthly;return {planText:monthly?'每月两袋 / ¥ 148 · 发货前可暂停':'一次体验 / ¥ 156 · 不自动续订',summary:monthly?'每月订阅 · 两袋 500 g / ¥ 148':'一次体验 · 两袋 500 g / ¥ 156',actionText:this.state.added?'已加入体验清单':'选择这份隙间',feedback:this.state.added?'已记录当前选择。此教学原型不下单、不扣款。':'',pickMonthly:()=>this.setState({monthly:true,added:false}),pickOnce:()=>this.setState({monthly:false,added:false}),addPlan:()=>this.setState({added:true})};}}</script></body></html>
