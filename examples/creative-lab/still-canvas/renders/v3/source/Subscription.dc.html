<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>04 订阅电商 · 可选择计划</title><script src="./support.js"></script></head><body><x-dc><helmet><style>@font-face{font-family:"STILL Sans";src:url("uploads/NotoSansSC-Regular.ttf")}body{margin:0;font-family:"STILL Sans","Noto Sans SC",sans-serif;color:#332C25}button,input{font:inherit}button:focus-visible{outline:3px solid #954128;outline-offset:4px}a{color:inherit}</style></helmet><main style="width:1440px;height:1100px;box-sizing:border-box;padding:64px;display:flex;flex-direction:column;gap:32px;background:#E9DFCF;overflow:hidden"><header style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;align-items:baseline;gap:22px"><span style="font:44px/1 Georgia,serif;letter-spacing:4px">STILL</span><span style="font-size:19px;letter-spacing:8px">隙间</span></div><nav style="display:flex;gap:36px;font-size:17px"><a href="#coffee" style="text-decoration:none">咖啡</a><a href="#subscription" style="text-decoration:none">隙间订阅</a><span>关于隙间</span><span>购物袋（0）</span></nav></header><div style="height:1px;background:#A79C89;width:100%"></div><section style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:54px"><div style="display:flex;flex-direction:column;justify-content:center;gap:20px"><div style="font-size:14px;letter-spacing:3px;color:#954128">每月两袋，按你的节奏。</div><h1 style="font-size:58px;line-height:1.22;font-weight:400;margin:0">咖啡如期而至，<br>日子不必赶。</h1><p style="font-size:18px;line-height:1.8;margin:0;max-width:550px">选一支熟悉的日常，再留一支给新鲜。<br>下一次发货前可调整、跳过或暂停。</p><div style="display:flex;gap:12px"><button type="button" onClick="{{pickMonthly}}" style="min-height:56px;padding:15px 28px;background:#173F37;color:#F5F0E7;border:1px solid #173F37;border-radius:2px;font-size:18px;cursor:pointer">每月订阅</button><button type="button" onClick="{{pickOnce}}" style="min-height:56px;padding:15px 28px;background:transparent;color:#332C25;border:1px solid #173F37;border-radius:2px;font-size:18px;cursor:pointer">先试一次</button></div><p role="status" style="font-size:16px;color:#655A4E;margin:0">{{planText}}</p></div><img src="uploads/still-coffee.png" alt="AI咖啡材料情境摄影" style="width:100%;height:410px;object-fit:cover;object-position:48% 50%"></section><section id="coffee" style="display:flex;flex-direction:column;gap:20px"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="font-size:30px;font-weight:400;margin:0">这一期，留给你的三种隙间。</h2><span style="font-size:15px;color:#655A4E;white-space:nowrap">价格为虚构教学示例 / 250 g</span></div><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px"><dc-import name="ProductCard" productname="日常拼配" series="01 / EVERYDAY" flavor="榛果 · 可可 · 焦糖" price="¥ 68" hint-size="405px,275px"></dc-import><dc-import name="ProductCard" productname="山坡花开" series="02 / SEASONAL" flavor="白花 · 柑橘 · 蜂蜜" price="¥ 88" hint-size="405px,275px"></dc-import><dc-import name="ProductCard" productname="夜色低因" series="03 / AFTER HOURS" flavor="熟果 · 黑糖 · 坚果" price="¥ 78" hint-size="405px,275px"></dc-import></div></section><footer id="subscription" style="display:flex;justify-content:space-between;align-items:center;padding:24px 0;border-top:1px solid #A79C89"><div><div style="font-size:23px">{{summary}}</div><div style="font-size:15px;color:#655A4E;margin-top:8px">由日常拼配与当季单品组成；发货前仍可调整。</div></div><div style="display:flex;gap:20px;align-items:center"><button type="button" onClick="{{addPlan}}" style="min-height:56px;padding:15px 28px;background:#173F37;color:#F5F0E7;border:1px solid #173F37;border-radius:2px;font-size:18px;cursor:pointer">{{actionText}}</button><span role="status" style="font-size:16px;max-width:240px">{{feedback}}</span></div></footer></main></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 1100}}'>class Component extends DCLogic {state={monthly:true,selected:1,added:false};renderVals(){const monthly=this.state.monthly;return {planText:monthly?'每月两袋 / ¥ 148 · 发货前可暂停':'一次体验 / ¥ 156 · 不自动续订',summary:monthly?'每月订阅 · 两袋 500 g / ¥ 148':'一次体验 · 两袋 500 g / ¥ 156',actionText:this.state.added?'已加入体验清单':'选择这份隙间',feedback:this.state.added?'已记录当前选择。此教学原型不下单、不扣款。':'',pickMonthly:()=>this.setState({monthly:true,added:false}),pickOnce:()=>this.setState({monthly:false,added:false}),addPlan:()=>this.setState({added:true})};}}</script></body></html>
