;top:373px;width:688px;height:455px;overflow:hidden"><img src="uploads/field-botanical-v4.png" alt="AI鸢尾摄影研究的花瓣局部" style="position:absolute;left:-165px;top:-195px;width:1020px;height:1360px;object-fit:cover" /></div><div style="position:absolute;left:56px;top:858px;width:340px;"><p style="margin:0;font-size:24px;line-height:1.5">01 / 完整的姿态</p><p style="margin:0;font-size:20px;line-height:1.75;margin-top:15px;color:#3E5947">保留花头、长叶与茎。用来建立对象，不急着追求视觉冲击。</p></div><div style="position:absolute;left:470px;top:858px;width:512px;"><p style="margin:0;font-size:24px;line-height:1.5">02 / 封面的取景</p><p style="margin:0;font-size:20px;line-height:1.75;margin-top:15px;color:#3E5947">花头偏上，留出边缘与视线方向。为刊名留位置，而不是缩小全部元素。</p></div><div style="position:absolute;left:1056px;top:858px;width:688px;"><p style="margin:0;font-size:24px;line-height:1.5">03 / 一处可以停留的细节</p><p style="margin:0;font-size:20px;line-height:1.75;margin-top:15px;color:#3E5947">放大褶皱、纹理与薄边，改变观看距离。局部必须说明身份，不能冒充另一件作品。</p></div></div></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":1060}}'>class Component extends DCLogic { renderVals(){return {};} }</script></body></html>
