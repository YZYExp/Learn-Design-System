<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>CropStudies.dc.html</title><script src="./support.js"></script></head><body><x-dc><helmet><style>@font-face{font-family:"Field Sans";src:url("fonts/NotoSansSC-Regular.ttf") format("truetype");font-weight:100 900}@font-face{font-family:"Field Serif";src:url("fonts/FieldSerif.otf") format("opentype")}body{margin:0;font-family:"Field Sans",sans-serif;color:#482C45}*{box-sizing:border-box}</style></helmet><div style="width:1800px;height:1000px;overflow:hidden;background:#F4EEDC;color:#482C45;position:relative"><div style="height:100%;padding:48px 56px;display:flex;flex-direction:column;gap:28px"><div style="display:flex;justify-content:space-between;align-items:center;color:#3E5947;font-size:19px;letter-spacing:1.4px;white-space:nowrap"><span style="margin:0;">FIELD NOTES / EDITORIAL WORKSHOP</span><span style="margin:0;">同一资产 · 三次取舍</span></div><h1 style="margin:0;font-size:51px;line-height:1.2;font-weight:400">改稿不是加装饰，是重新分配注意力。</h1><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px"><section style="display:flex;flex-direction:column;gap:18px"><p style="margin:0;font-family:Field Serif,serif;font-size:36px;line-height:1">01</p><img src="uploads/field-botanical.png" alt="紫色鸢尾水粉画，AI生成的艺术图像" style="display:block;width:536px;height:455px;object-fit:contain;object-position:50% 50%;" /><h2 style="margin:0;font-size:33px;line-height:1.3;font-weight:500">分离阅读区</h2><p style="margin:0;font-size:25px;line-height:1.65;color:#3E5947">先为刊名和专题留出纸色，避免以变浅文字来补救复杂背景。</p></section><section style="display:flex;flex-direction:column;gap:18px"><p style="margin:0;font-family:Field Serif,serif;font-size:36px;line-height:1">02</p><img src="uploads/field-botanical.png" alt="紫色鸢尾水粉画，AI生成的艺术图像" style="display:block;width:536px;height:455px;object-fit:cover;object-position:50% 50%;" /><h2 style="margin:0;font-size:33px;line-height:1.3;font-weight:500">保留花心关系</h2><p style="margin:0;font-size:25px;line-height:1.65;color:#3E5947">纵向裁切切去部分叶梢，让三朵花的中心仍可被辨认。</p></section><section style="display:flex;flex-direction:column;gap:18px"><p style="margin:0;font-family:Field Serif,serif;font-size:36px;line-height:1">03</p><div style="position:relative;width:536px;height:455px;overflow:hidden"><img src="uploads/field-botanical.png" alt="紫色鸢尾水粉画，AI生成的艺术图像" style="display:block;position:absolute;left:-160px;top:-340px;width:900px;height:1200px;object-fit:cover;" /></div><h2 style="margin:0;font-size:33px;line-height:1.3;font-weight:500">换一种观看尺度</h2><p style="margin:0;font-size:25px;line-height:1.65;color:#3E5947">跨页放大花瓣褶皱，图注明确“局部”，不伪造标本记录。</p></section></div><div style="height:1px;background:#B4AA97;width:100%"></div><p style="margin:0;font-size:23px;line-height:1.6;color:#3E5947">验证顺序：先看刊名 → 再看主题 → 最后读刊号。每次只改变一个关系，保留比较证据。</p></div></div></x-dc><script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":1000}}'>class Component extends DCLogic {renderVals(){return {};}}</script></body></html>
